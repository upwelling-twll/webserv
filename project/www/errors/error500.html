<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>500 – Internal Server Error</title>

    body {

      padding: 0;
      font-family: Georgia, serif;
      background: #2c2c2c;
      color: #f5f5f5;

    }
    header {
      padding: 2rem;
      background: #4b0000;
      color: #f5f5f5;

      letter-spacing: 2px;
      text-shadow: 1px 1px #000;

    <blockquote>
